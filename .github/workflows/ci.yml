name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # e2e was run here on ubuntu-latest via `npx playwright install --with-deps
  # chromium`, but that install step hung indefinitely (no error, no
  # progress) at least twice — one caught after 20+ minutes, another after
  # 2h23m — with nothing in the CI logs to trace past "it stopped moving
  # here." A timeout-minutes backstop (tried first) would only turn the hang
  # into a fast failure, not a passing signal, so e2e is run locally instead
  # for now rather than blocking/false-failing every PR on flaky CI infra.

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # Same GHA cache docker-publish.yml writes to on every push to
          # master — GitHub Actions cache lets a PR read its base branch's
          # cache entries (but only write its own), so this job reuses
          # whatever master's last publish run already compiled instead of
          # rebuilding from scratch (the slow part is better-sqlite3's
          # node-gyp compile under arm64/qemu emulation) on every PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max
